    <script>
      // Suppress benign Vite HMR WebSocket connection errors in sandboxed / iframe environments
      window.addEventListener('error', function(event) {
        var msg = (event && (event.message || (event.error && event.error.message))) || '';
        if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('[vite]') || msg.includes('vite:'))) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var reasonMsg = (event && event.reason && (event.reason.message || event.reason)) || '';
        if (typeof reasonMsg === 'string' && (reasonMsg.includes('WebSocket') || reasonMsg.includes('[vite]'))) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
