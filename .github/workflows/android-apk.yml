name: VoxArt Studio Android APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Configure Android SDK & Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_DIR" ] || [ ! -d "$SDK_DIR" ]; then
            SDK_DIR="/usr/local/lib/android/sdk"
          fi
          echo "SDK_DIR=$SDK_DIR"
          ls -la "$SDK_DIR/platforms" 2>/dev/null || true
          echo "sdk.dir=$SDK_DIR" > android/local.properties
          SDKMGR=$(find "$SDK_DIR" -name "sdkmanager" 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMGR" ]; then
            echo "Found sdkmanager: $SDKMGR"
            yes | sudo "$SDKMGR" --sdk_root="$SDK_DIR" --licenses > /dev/null 2>&1 || true
            if [ ! -d "$SDK_DIR/platforms/android-34" ]; then
              sudo "$SDKMGR" --sdk_root="$SDK_DIR" "platforms;android-34" "build-tools;34.0.0" || true
            fi
          fi

      - name: Build APK with Gradle
        working-directory: ./android
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee ../gradle-build.log

      - name: Report Build Error Details
        if: failure()
        run: |
          if [ -f gradle-build.log ]; then
            echo "### Gradle Failure Log (tail)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 60 gradle-build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            ERR_LINE=$(grep -E "FAILURE:|What went wrong:|Execution failed|error:" gradle-build.log | head -n 8 | tr '\n' ' ')
            echo "::error title=Gradle Build Error::$ERR_LINE"
          fi

      - name: Prepare APK File
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/VoxArt-Studio.apk
          ls -lh output/VoxArt-Studio.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxArt-Studio-APK
          path: output/VoxArt-Studio.apk
          retention-days: 30

      - name: Publish Direct Download in GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: output/VoxArt-Studio.apk
          name: VoxArt Studio APK (v${{ github.run_number }})
          tag_name: apk-v${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
