name: Build VoxArt Studio APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Build APK with Gradle
        working-directory: ./android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK File
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/VoxArt-Studio.apk
          ls -lh output/VoxArt-Studio.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxArt-Studio-APK
          path: output/VoxArt-Studio.apk
          retention-days: 30

      - name: Publish Direct Download in GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: output/VoxArt-Studio.apk
          name: VoxArt Studio APK (v${{ github.run_number }})
          tag_name: apk-v${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
